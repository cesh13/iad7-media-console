<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#101215}button,select,input{font-family:inherit}</style>
</helmet>
<div style="width: 960px; height: 640px; box-sizing: border-box; padding: 16px; background: #101215; color: #E8E6E1; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13px; display: flex; flex-direction: column; gap: 14px;">

<div style="display: flex; align-items: center; gap: 10px;">
<span style="padding: 3px 8px; background: #5BA4FF; color: #0B1420; font-size: 11px; font-weight: 700; border-radius: 3px; letter-spacing: 0.6px;">PREVIEW</span>
<h1 style="margin: 0; font-size: 18px; font-weight: 600;">01 Bienvenida.mp4</h1>
<span style="color: #9AA0A8;">1920×1080 · 2:14 · local copy ✓</span>
<div style="flex: 1;"></div>
<label for="vt" style="color: #9AA0A8;">Send to</label>
<select id="vt" style="height: 36px; padding: 0 10px; background: #1F2328; color: #E8E6E1; border: 1px solid #3A3F47; border-radius: 6px; font-size: 13px;"><option>Group A · Main (1, 2)</option></select>
<button type="button" style="height: 36px; padding: 0 16px; background: #D13438; color: #FFFFFF; border: 0; border-radius: 6px; font-size: 13px; font-weight: 700;">Go live</button>
</div>

<div style="display: flex; gap: 14px; flex: 1; min-height: 0;">
<div style="flex: 1 1 600px; display: flex; flex-direction: column; gap: 10px; min-width: 0;">
<div style="aspect-ratio: 16 / 9; background: #0B0D10; border: 2px solid #5BA4FF; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #868D97;">
<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#C9CDD3" stroke-width="1.4" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M10 8l6 4-6 4z"></path></svg>
<span>[Video frame at 0:38 · preview is muted]</span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px;">
<div style="position: relative; height: 28px;">
<div style="position: absolute; left: 0; right: 0; top: 12px; height: 4px; background: #2A2E35; border-radius: 2px;"></div>
<div style="position: absolute; left: 3.7%; width: 24.6%; top: 12px; height: 4px; background: #5BA4FF; border-radius: 2px;"></div>
<div style="position: absolute; left: 0; width: 3.7%; top: 12px; height: 4px; background: #1A1D22;"></div>
<div style="position: absolute; left: 97%; right: 0; top: 12px; height: 4px; background: #1A1D22;"></div>
<div style="position: absolute; left: 28.3%; top: 4px; width: 3px; height: 20px; background: #FFFFFF; border-radius: 2px;"></div>
<div style="position: absolute; left: 59.7%; top: 0; width: 10px; height: 10px; background: #E2B35B; transform: rotate(45deg);"></div>
<div style="position: absolute; left: 3.7%; top: 6px; width: 2px; height: 16px; background: #4CC38A;"></div>
<div style="position: absolute; left: 97%; top: 6px; width: 2px; height: 16px; background: #4CC38A;"></div>
</div>
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #9AA0A8;">
<span>0:00</span><span style="color: #E8E6E1;">0:38 / -1:32</span><span>2:14</span>
</div>
<div style="display: flex; gap: 14px; font-size: 11px; color: #9AA0A8;">
<span style="display: flex; align-items: center; gap: 4px;"><span style="width: 2px; height: 10px; background: #4CC38A;"></span>Start 0:05 / End 2:10</span>
<span style="display: flex; align-items: center; gap: 4px;"><span style="width: 8px; height: 8px; background: #E2B35B; transform: rotate(45deg);"></span>Cue 1:20 · "pausa para oración"</span>
</div>
</div>

<div style="display: flex; align-items: center; gap: 8px;">
<button type="button" aria-label="Back to start" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #1F2328; color: #E8E6E1; border: 1px solid #3A3F47; border-radius: 6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 5v14M18 6l-9 6 9 6z"></path></svg></button>
<button type="button" style="height: 40px; padding: 0 10px; background: #1F2328; color: #E8E6E1; border: 1px solid #3A3F47; border-radius: 6px; font-size: 12px;">−10 s</button>
<button type="button" aria-label="Play" style="width: 48px; height: 40px; display: flex; align-items: center; justify-content: center; background: #E8E6E1; color: #101215; border: 0; border-radius: 6px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5l12 7-12 7z"></path></svg></button>
<button type="button" style="height: 40px; padding: 0 10px; background: #1F2328; color: #E8E6E1; border: 1px solid #3A3F47; border-radius: 6px; font-size: 12px;">+10 s</button>
<button type="button" style="height: 40px; padding: 0 10px; background: #1F2328; color: #E8E6E1; border: 1px solid #3A3F47; border-radius: 6px; font-size: 12px;">Jump to cue</button>
<div style="flex: 1;"></div>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA0A8" stroke-width="1.8" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg>
<label for="vol" style="position: absolute; left: -9999px;">Volume</label>
<input id="vol" type="range" value="80" style="width: 110px;">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #9AA0A8;">80%</span>
</div>
</div>

<div style="flex: 0 0 250px; display: flex; flex-direction: column; gap: 10px; padding: 12px; background: #16191D; border: 1px solid #2A2E35; border-radius: 6px;">
<span style="color: #868D97; font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase;">Playback</span>
<div style="display: flex; gap: 8px;">
<label style="flex: 1; display: flex; flex-direction: column; gap: 4px; color: #9AA0A8; font-size: 12px;">Start<input type="text" value="0:05" style="height: 32px; padding: 0 8px; background: #0F1114; color: #E8E6E1; border: 1px solid #3A3F47; border-radius: 4px; font-family: 'IBM Plex Mono', monospace;"></label>
<label style="flex: 1; display: flex; flex-direction: column; gap: 4px; color: #9AA0A8; font-size: 12px;">End<input type="text" value="2:10" style="height: 32px; padding: 0 8px; background: #0F1114; color: #E8E6E1; border: 1px solid #3A3F47; border-radius: 4px; font-family: 'IBM Plex Mono', monospace;"></label>
</div>
<span style="color: #868D97; font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; margin-top: 4px;">When it ends</span>
<label style="display: flex; align-items: center; gap: 8px; color: #C9CDD3;"><input type="radio" name="end" checked="checked"> Go to next item</label>
<label style="display: flex; align-items: center; gap: 8px; color: #C9CDD3;"><input type="radio" name="end"> Black screen</label>
<label style="display: flex; align-items: center; gap: 8px; color: #C9CDD3;"><input type="radio" name="end"> Hold last frame</label>
<label style="display: flex; align-items: center; gap: 8px; color: #C9CDD3;"><input type="radio" name="end"> Loop</label>
<span style="color: #868D97; font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; margin-top: 4px;">Audio</span>
<label style="display: flex; flex-direction: column; gap: 4px; color: #9AA0A8; font-size: 12px;">Output device<select style="height: 32px; padding: 0 8px; background: #1F2328; color: #E8E6E1; border: 1px solid #3A3F47; border-radius: 4px; font-size: 12px;"><option>Mixer (USB audio)</option><option>Laptop speakers</option></select></label>
<label style="display: flex; align-items: center; gap: 8px; color: #C9CDD3;"><input type="checkbox" checked="checked"> Fade in / out 1 s</label>
<label style="display: flex; align-items: center; gap: 8px; color: #C9CDD3;"><input type="checkbox"> Stop background music</label>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":640}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
